# ops.conf for the main server: Oracle A1, 4 OCPU / 24 GB, ARM.
# No secrets here; those live in /etc/ops on the server.

OPS_HOST=main
OPS_ARCH=arm64

# Oracle's free allowance is 2 OCPU / 12 GB for this shape on a 31-day month.
# Staying within it means the instance can shrink without any redesign.
RESOURCE_BUDGET_CPUS=2
RESOURCE_BUDGET_MEM=12g

# UTC: 03:30 Beijing nightly, Monday 05:00 Beijing weekly.
BACKUP_TIME="30 19 * * *"
CHECK_TIME="0 21 * * 0"

# GitHub Actions in the xxvlab repository publishes the site as this user.
DEPLOY_USER=deploy
